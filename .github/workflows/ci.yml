name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: easy_cook
          POSTGRES_PASSWORD: easy_cook
          POSTGRES_DB: easy_cook_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U easy_cook -d easy_cook_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20

    # The app validates its env on start-up. OpenAI is faked in every test, so the key is a dummy.
    # e2e tests run on TEST_DATABASE_URL and refuse to start when it equals DATABASE_URL.
    env:
      PORT: 3100
      ENV: local
      CORS_ORIGINS: '*'
      SWAGGER_ENABLED: 'false'
      LOG_LEVEL: warn
      OPEN_AI_API_KEY: sk-ci-dummy
      DATABASE_URL: postgresql://easy_cook:easy_cook@localhost:5432/easy_cook?schema=public
      TEST_DATABASE_URL: postgresql://easy_cook:easy_cook@localhost:5432/easy_cook_test?schema=public

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run type-check

      - name: Unit tests
        run: npm test

      - name: e2e tests
        run: npm run test:e2e

      - name: Build
        run: npm run build
