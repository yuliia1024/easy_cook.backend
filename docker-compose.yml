# Easy Cook local stack. Host ports: api 3100, postgres 5442.
#
#   npm run infra:up   -> postgres only (run the API with `npm run start:dev`)
#   npm run compose    -> postgres + the API container
name: easy-cook

services:
  api:
    container_name: easy-cook-api
    build: ./
    env_file: .env
    environment:
      PORT: 3000
      DATABASE_URL: 'postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public'
    ports:
      - '${PORT:-3100}:3000'
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    container_name: easy-cook-postgres
    # Postgres 17 with the pgvector extension available (enabled later, for RAG).
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: '${POSTGRES_USER}'
      POSTGRES_PASSWORD: '${POSTGRES_PASSWORD}'
      POSTGRES_DB: '${POSTGRES_DB}'
    volumes:
      - pg_data:/var/lib/postgresql/data
    ports:
      - '5442:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  pg_data:
