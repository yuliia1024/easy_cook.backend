# Easy Cook local stack. Host ports: api 3100, postgres 5442, redis 6389, ollama 11434.
#
#   npm run infra:up          -> postgres and redis (run the API with `npm run start:dev`)
#   npm run infra:embeddings  -> the local embedding model (Ollama), ready once healthy
#   npm run compose           -> postgres + redis + the API container
name: easy-cook

services:
  api:
    container_name: easy-cook-api
    build: ./
    env_file: .env
    environment:
      PORT: 3000
      DATABASE_URL: 'postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public'
      OLLAMA_BASE_URL: 'http://ollama:11434'
      REDIS_URL: 'redis://:${REDIS_PASSWORD}@redis:6379/0'
    ports:
      - '${PORT:-3100}:3000'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Sessions and rate limits. Password protected, bound to localhost only, no persistence to disk
  # beyond the append-only log (sessions survive a restart).
  redis:
    container_name: easy-cook-redis
    image: redis:8.2-alpine
    command:
      - redis-server
      - --requirepass
      - '${REDIS_PASSWORD}'
      - --appendonly
      - 'yes'
      - --rename-command
      - FLUSHALL
      - ''
    environment:
      REDISCLI_AUTH: '${REDIS_PASSWORD}'
    volumes:
      - redis_data:/data
    ports:
      - '127.0.0.1:6389:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 2s
      timeout: 3s
      retries: 20

  postgres:
    container_name: easy-cook-postgres
    # Postgres 17 with the pgvector extension available (enabled later, for RAG).
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: '${POSTGRES_USER}'
      POSTGRES_PASSWORD: '${POSTGRES_PASSWORD}'
      POSTGRES_DB: '${POSTGRES_DB}'
    volumes:
      - pg_data:/var/lib/postgresql/data
    ports:
      - '5442:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 2s
      timeout: 3s
      retries: 20

  # The embedding model of the recipe search (EMBEDDING_PROVIDERS, first `ollama`). Pulls the
  # model on the first start into the volume; healthy once the model is there. In Docker on macOS
  # it runs on the CPU (no Metal) - enough for qwen3-embedding 0.6B; the native Ollama app is faster.
  ollama:
    container_name: easy-cook-ollama
    image: ollama/ollama:0.40.15
    entrypoint: ['/bin/sh', '-c']
    command:
      - 'ollama serve & until ollama list >/dev/null 2>&1; do sleep 1; done; ollama pull "$$EMBEDDING_MODEL" && wait'
    environment:
      # Keep in sync with EMBEDDING_MODELS.ollama in src/common/constants/search.ts.
      EMBEDDING_MODEL: 'qwen3-embedding:0.6b-q8_0'
      # The model stays loaded: the first query after an idle spell does not pay the load.
      OLLAMA_KEEP_ALIVE: '-1'
      OLLAMA_NUM_PARALLEL: '4'
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - '11434:11434'
    healthcheck:
      test: ['CMD-SHELL', 'ollama show "$$EMBEDDING_MODEL" >/dev/null 2>&1']
      interval: 5s
      timeout: 5s
      # The first pull (~640 MB) takes a while.
      start_period: 10m
      retries: 30

volumes:
  pg_data:
  redis_data:
  ollama_data:
